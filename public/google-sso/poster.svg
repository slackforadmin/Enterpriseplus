<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F1F5FB"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- soft corner accent (Google blue) -->
  <circle cx="1180" cy="90" r="140" fill="#4285F4" fill-opacity="0.08"/>

  <!-- Google G logo -->
  <g transform="translate(120, 150) scale(1.5)">
    <path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h13.2c-.6 3.1-2.3 5.7-4.9 7.5v6.2h7.9c4.6-4.3 7.3-10.6 7.3-17.7z"/>
    <path fill="#34A853" d="M24 48c6.5 0 12-2.2 16-5.8l-7.9-6.2c-2.2 1.5-5 2.3-8.1 2.3-6.2 0-11.5-4.2-13.4-9.8H2.4v6.4C6.4 42.6 14.5 48 24 48z"/>
    <path fill="#FBBC05" d="M10.6 28.5c-.5-1.5-.8-3.1-.8-4.5s.3-3 .8-4.5v-6.4H2.4A23.9 23.9 0 000 24c0 3.9.9 7.5 2.4 10.9l8.2-6.4z"/>
    <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.5 0 24 0 14.5 0 6.4 5.4 2.4 13.1l8.2 6.4C12.5 13.9 17.8 9.5 24 9.5z"/>
  </g>

  <!-- eyebrow -->
  <text x="122" y="330" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4285F4" letter-spacing="2">GOOGLE WORKSPACE · SSO</text>

  <!-- title -->
  <text x="120" y="400" font-family="Inter, -apple-system, sans-serif" font-size="66" font-weight="800" fill="#0A2540" letter-spacing="-1">Google SSO 설정</text>
  <text x="120" y="450" font-family="Inter, -apple-system, sans-serif" font-size="23" font-weight="400" fill="#5B6B7F">SAML 기반 Single Sign-On 연동 가이드 영상</text>

  <!-- play button -->
  <g transform="translate(1000, 300)">
    <circle cx="60" cy="60" r="60" fill="#4285F4" fill-opacity="0.12"/>
    <circle cx="60" cy="60" r="46" fill="#4285F4"/>
    <path d="M50 40 L84 60 L50 80 Z" fill="#ffffff"/>
  </g>
</svg>
