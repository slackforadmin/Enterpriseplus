<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.55" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- eyebrow -->
  <g transform="translate(120, 250)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
    <text x="75" y="23" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">SSO · Google</text>
  </g>

  <!-- title -->
  <text x="120" y="360" font-family="Inter, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">Google SSO 설정</text>
  <text x="120" y="412" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.72">Google Workspace SAML 연동 가이드 영상</text>

  <!-- play button -->
  <g transform="translate(1000, 300)">
    <circle cx="60" cy="60" r="60" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="60" cy="60" r="46" fill="#ffffff"/>
    <path d="M50 40 L84 60 L50 80 Z" fill="#0A2540"/>
  </g>
</svg>
